name: Test NBA standings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p public/data

      - name: Get NBA standings
        run: |
          curl --fail --location \
            --request GET \
            --url "https://v2.nba.api-sports.io/standings?league=standard&season=2026" \
            --header "x-apisports-key: ${{ secrets.API_NBA_KEY }}" \
            --output public/data/test-standings.json

      - name: Verify response
        run: |
          python -m json.tool public/data/test-standings.json > /dev/null

          echo "Valid JSON received"
          ls -lh public/data/test-standings.json

      - name: Commit test data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/test-standings.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Test NBA standings"
            git push
          fi
