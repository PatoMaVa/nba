name: Update NBA data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get NBA games
        run: |
          curl --fail --location \
            --request GET \
            --url "https://v2.nba.api-sports.io/games?date=2026-11-17" \
            --header "x-apisports-key: ${{ secrets.API_NBA_KEY }}" \
            --header "Accept: application/json" \
            --output public/data/scoreboard.json

      - name: Verify API response
        run: |
          python -m json.tool public/data/scoreboard.json > /dev/null
          echo "Valid JSON received"
          echo "File size:"
          ls -lh public/data/scoreboard.json

      - name: Commit NBA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/scoreboard.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update NBA scoreboard"
            git push
          fi
