name: Update NBA data

on:
  schedule:
    - cron: "7 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nba-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create data folder
        run: mkdir -p public/data

      - name: Download NBA games, player statistics and Spanish player IDs
        env:
          API_NBA_KEY: ${{ secrets.API_NBA_KEY }}
        run: |
          python <<'PYTHON'
          import json
          import os
          import time
          import unicodedata
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          API_BASE = "https://v2.nba.api-sports.io"
          API_KEY = os.environ["API_NBA_KEY"]

          DATA_FOLDER = Path("public/data")
          SCOREBOARD_FILE = DATA_FOLDER / "scoreboard.json"
          PLAYER_STATS_FILE = DATA_FOLDER / "player-stats.json"
          SPANISH_PLAYERS_FILE = DATA_FOLDER / "spanish-players.json"

          DATA_FOLDER.mkdir(parents=True, exist_ok=True)

          SPANISH_PLAYERS = [
              {"name": "Santi Aldama", "id": 2786},
              {"name": "Sergio De Larrea", "id": 4408},
              {"name": "Aday Mara", "id": 4358},
              {"name": "Baba Miller", "id": 3950},
              {"name": "Hugo Gonzalez", "id": None},
          ]

          today = datetime.now(
              ZoneInfo("Europe/Madrid")
          ).strftime("%Y-%m-%d")

          print(f"NBA date: {today}")

          def normalize(value):
              value = unicodedata.normalize("NFD", str(value or ""))
              value = "".join(
                  char for char in value
                  if unicodedata.category(char) != "Mn"
              )
              return " ".join(value.lower().replace(".", " ").split())

          def player_full_name(player):
              return " ".join(
                  part for part in [
                      str(player.get("firstname") or "").strip(),
                      str(player.get("lastname") or "").strip(),
                  ]
                  if part
              )

          def api_request(endpoint, parameters):
              query = urllib.parse.urlencode(parameters)
              url = f"{API_BASE}/{endpoint}?{query}"
              print(f"Requesting: {endpoint}?{query}")

              request = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": API_KEY,
                      "Accept": "application/json",
                      "User-Agent": "NBAStatsApp-GitHub-Action/1.0",
                  },
              )

              with urllib.request.urlopen(request, timeout=45) as response:
                  body = response.read().decode("utf-8")

              data = json.loads(body)
              errors = data.get("errors")

              if isinstance(errors, dict) and errors:
                  raise RuntimeError(f"API-Sports error: {errors}")
              if isinstance(errors, list) and errors:
                  raise RuntimeError(f"API-Sports error: {errors}")

              return data

          def load_spanish_registry():
              registry = {
                  "updatedAt": None,
                  "players": [],
              }

              if not SPANISH_PLAYERS_FILE.exists():
                  return registry

              try:
                  with SPANISH_PLAYERS_FILE.open("r", encoding="utf-8") as file:
                      existing = json.load(file)

                  if isinstance(existing.get("players"), list):
                      registry = existing
                      print("Existing Spanish player IDs loaded")
              except Exception as error:
                  print(f"Could not read Spanish player IDs: {error}")

              return registry

          def registry_by_name(registry):
              return {
                  normalize(item.get("name")): item
                  for item in registry.get("players", [])
                  if item.get("id") is not None and item.get("name")
              }

          def find_exact_player(candidates, expected_name):
              expected = normalize(expected_name)
              expected_parts = expected.split()
              expected_first = expected_parts[0] if expected_parts else ""
              expected_surname = expected_parts[-1] if expected_parts else ""

              exact = [
                  player for player in candidates
                  if normalize(player_full_name(player)) == expected
              ]

              if len(exact) == 1:
                  return exact[0]

              # API-NBA sometimes abbreviates first names, for example
              # "S. de Larrea" instead of "Sergio De Larrea".
              abbreviated = []
              for player in candidates:
                  first = normalize(player.get("firstname"))
                  last = normalize(player.get("lastname"))
                  full = normalize(player_full_name(player))

                  first_initial_matches = (
                      first and expected_first and first[0] == expected_first[0]
                  )
                  surname_matches = (
                      last == expected_surname
                      or full.endswith(" " + " ".join(expected_parts[1:]))
                  )

                  if first_initial_matches and surname_matches:
                      abbreviated.append(player)

              matches = exact or abbreviated

              if len(matches) == 1:
                  return matches[0]

              if len(matches) > 1:
                  active = [
                      player for player in matches
                      if (
                          player.get("leagues", {})
                          .get("standard", {})
                          .get("active") is True
                      )
                  ]
                  if len(active) == 1:
                      return active[0]

                  raise RuntimeError(
                      f"Multiple API-NBA matches for {expected_name}: "
                      f"{[(player.get('id'), player_full_name(player)) for player in matches]}"
                  )

              return None

          def discover_spanish_players(registry, all_box_stats):
              known = registry_by_name(registry)

              # Seed the registry with IDs already confirmed by API-NBA runs.
              for target in SPANISH_PLAYERS:
                  if target.get("id") is None:
                      continue
                  key = normalize(target["name"])
                  known[key] = {
                      "id": int(target["id"]),
                      "name": target["name"],
                      "apiName": known.get(key, {}).get("apiName") or target["name"],
                  }

              # Learn any still-missing Spanish player directly from downloaded box scores.
              # This handles API abbreviations such as A. Mara without extra /players calls.
              for target in SPANISH_PLAYERS:
                  key = normalize(target["name"])
                  if key in known:
                      continue

                  target_parts = key.split()
                  target_first = target_parts[0] if target_parts else ""
                  target_surname = target_parts[-1] if target_parts else ""
                  matches = []

                  for stat in all_box_stats:
                      player = stat.get("player") or {}
                      full_name = normalize(player_full_name(player))
                      first = normalize(player.get("firstname"))
                      last = normalize(player.get("lastname"))

                      exact = full_name == key
                      abbreviated = (
                          first
                          and target_first
                          and first[0] == target_first[0]
                          and last == target_surname
                      )

                      if exact or abbreviated:
                          matches.append(player)

                  unique = {
                      player.get("id"): player
                      for player in matches
                      if player.get("id") is not None
                  }

                  if len(unique) == 1:
                      player = next(iter(unique.values()))
                      known[key] = {
                          "id": int(player["id"]),
                          "name": target["name"],
                          "apiName": player_full_name(player),
                      }
                      print(
                          f"Spanish player found in box score: "
                          f"{target['name']} = {player['id']}"
                      )
                  else:
                      print(
                          f"Spanish player ID still pending: {target['name']}"
                      )

              ordered = [
                  known[normalize(target["name"])]
                  for target in SPANISH_PLAYERS
                  if normalize(target["name"]) in known
              ]

              ids = [item["id"] for item in ordered]
              if len(set(ids)) != len(ids):
                  raise RuntimeError(
                      f"Duplicate Spanish player IDs detected: {ids}"
                  )

              return {
                  "updatedAt": datetime.now(
                      ZoneInfo("Europe/Madrid")
                  ).isoformat(),
                  "source": "API-NBA / API-Sports",
                  "results": len(ordered),
                  "players": ordered,
              }

          scoreboard = api_request("games", {"date": today})
          games = scoreboard.get("response", [])

          with SCOREBOARD_FILE.open("w", encoding="utf-8") as file:
              json.dump(
                  scoreboard,
                  file,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )

          print(f"Downloaded {len(games)} games")

          player_stats_data = {
              "date": today,
              "updatedAt": None,
              "games": {},
          }

          if PLAYER_STATS_FILE.exists():
              try:
                  with PLAYER_STATS_FILE.open("r", encoding="utf-8") as file:
                      saved_data = json.load(file)

                  if saved_data.get("date") == today:
                      player_stats_data = saved_data
                      print("Existing player statistics loaded")
                  else:
                      print("Existing player statistics belong to another date")
              except Exception as error:
                  print(f"Could not read existing player statistics: {error}")

          player_stats_data.setdefault("games", {})

          downloaded = 0
          skipped = 0
          pending = 0
          failed = 0

          for game in games:
              game_id = game.get("id")
              game_status = game.get("status", {}).get("short")

              if game_id is None:
                  continue

              game_key = str(game_id)

              if game_key in player_stats_data["games"]:
                  print(f"Game {game_key}: statistics already saved")
                  skipped += 1
                  continue

              if game_status != 3:
                  print(f"Game {game_key}: not finished yet")
                  pending += 1
                  continue

              try:
                  stats = api_request(
                      "players/statistics",
                      {"game": game_id},
                  )

                  player_stats_data["games"][game_key] = {
                      "gameId": game_id,
                      "updatedAt": datetime.now(
                          ZoneInfo("Europe/Madrid")
                      ).isoformat(),
                      "results": stats.get("results", 0),
                      "response": stats.get("response", []),
                  }

                  downloaded += 1
                  print(
                      f"Game {game_key}: "
                      f"{stats.get('results', 0)} player records"
                  )
                  time.sleep(1)
              except Exception as error:
                  failed += 1
                  print(f"Game {game_key}: statistics failed: {error}")

          player_stats_data["date"] = today
          player_stats_data["updatedAt"] = datetime.now(
              ZoneInfo("Europe/Madrid")
          ).isoformat()

          with PLAYER_STATS_FILE.open("w", encoding="utf-8") as file:
              json.dump(
                  player_stats_data,
                  file,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )

          all_box_stats = []
          for game_data in player_stats_data.get("games", {}).values():
              all_box_stats.extend(game_data.get("response", []))

          spanish_registry = load_spanish_registry()
          spanish_registry = discover_spanish_players(
              spanish_registry,
              all_box_stats,
          )

          with SPANISH_PLAYERS_FILE.open("w", encoding="utf-8") as file:
              json.dump(
                  spanish_registry,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )
              file.write("\n")

          print("")
          print("NBA update completed")
          print(f"Games today: {len(games)}")
          print(f"New statistics: {downloaded}")
          print(f"Previously saved: {skipped}")
          print(f"Pending games: {pending}")
          print(f"Failed statistics: {failed}")
          print("Spanish players:")
          for player in spanish_registry["players"]:
              print(f"  {player['name']}: {player['id']} ({player['apiName']})")
          PYTHON

      - name: Verify generated JSON files
        run: |
          python -m json.tool public/data/scoreboard.json > /dev/null
          python -m json.tool public/data/player-stats.json > /dev/null
          python -m json.tool public/data/spanish-players.json > /dev/null

          python <<'PYTHON'
          import json

          with open(
              "public/data/spanish-players.json",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          players = data.get("players", [])
          expected_ids = {
              "Santi Aldama": 2786,
              "Sergio De Larrea": 4408,
              "Aday Mara": 4358,
              "Baba Miller": 3950,
          }
          received = {
              player.get("name"): player.get("id")
              for player in players
          }

          for name, player_id in expected_ids.items():
              if received.get(name) != player_id:
                  raise RuntimeError(
                      f"Missing or invalid Spanish player ID: {name}={received.get(name)}"
                  )

          ids = [player.get("id") for player in players]
          if None in ids or len(set(ids)) != len(ids):
              raise RuntimeError(
                  f"Invalid Spanish player IDs: {ids}"
              )

          print("Spanish player IDs validated:")
          for player in players:
              print(
                  player["name"],
                  "=",
                  player["id"],
                  f"({player.get('apiName')})",
              )
          PYTHON

          echo "All JSON files are valid"

          echo ""
          echo "Scoreboard:"
          ls -lh public/data/scoreboard.json

          echo ""
          echo "Player statistics:"
          ls -lh public/data/player-stats.json

          echo ""
          echo "Spanish players:"
          ls -lh public/data/spanish-players.json

      - name: Commit NBA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/scoreboard.json
          git add public/data/player-stats.json
          git add public/data/spanish-players.json

          if git diff --cached --quiet; then
            echo "No NBA data changes"
            exit 0
          fi

          git commit -m "Update NBA games, player statistics and Spanish player IDs"

          echo "Synchronizing with latest main..."
          git pull --rebase origin main

          echo "Pushing NBA data..."
          git push origin main
