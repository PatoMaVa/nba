name: Update NBA data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download NBA scoreboard
        run: |
          curl --fail --location \
            --retry 3 \
            --user-agent "Mozilla/5.0" \
            "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json" \
            --output public/data/scoreboard.json

      - name: Verify downloaded JSON
        run: |
          python -m json.tool public/data/scoreboard.json > /dev/null
          echo "NBA scoreboard downloaded successfully"

      - name: Commit NBA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/scoreboard.json

          if git diff --cached --quiet; then
            echo "No NBA data changes"
          else
            git commit -m "Update NBA scoreboard"
            git push
          fi
