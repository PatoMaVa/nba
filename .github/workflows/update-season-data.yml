      - name: Commit updated season data
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/standings.json
          git add public/data/season-player-stats.json

          if git diff --cached --quiet; then
            echo "No season data changes"
            exit 0
          fi

          git commit \
            -m "Update NBA season standings and player stats"

          echo "Synchronizing with latest main..."

          git pull \
            --rebase \
            origin \
            main

          echo "Pushing season data..."

          git push origin main
