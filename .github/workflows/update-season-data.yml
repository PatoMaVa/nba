name: Update NBA season data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nba-season-data
  cancel-in-progress: false

jobs:
  update-season-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create data folder
        run: mkdir -p public/data

      - name: Download and convert season data
        env:
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
        run: |
          python <<'PYTHON'
          import csv
          import io
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          SEASON = "2026-27"
          SEASON_YEAR = 2026

          API_KEY = os.environ.get("API_NINJAS_KEY", "").strip()
          if not API_KEY:
              raise RuntimeError("Missing GitHub secret API_NINJAS_KEY")

          STANDINGS_URL = (
              "https://api.api-ninjas.com/v1/basketballstandings?"
              + urllib.parse.urlencode({
                  "league": "nba",
                  "season": SEASON_YEAR,
              })
          )

          PLAYERS_URL = (
              "https://boxscorelab.com/downloads/"
              f"{SEASON}-player-season-totals.csv"
          )

          OUTPUT_DIRECTORY = Path("public/data")
          STANDINGS_FILE = OUTPUT_DIRECTORY / "standings.json"
          PLAYERS_FILE = OUTPUT_DIRECTORY / "season-player-stats.json"
          OUTPUT_DIRECTORY.mkdir(parents=True, exist_ok=True)

          EXPECTED_TEAM_CODES = {
              "ATL", "BOS", "BKN", "CHA", "CHI", "CLE",
              "DAL", "DEN", "DET", "GSW", "HOU", "IND",
              "LAC", "LAL", "MEM", "MIA", "MIL", "MIN",
              "NOP", "NYK", "OKC", "ORL", "PHI", "PHX",
              "POR", "SAC", "SAS", "TOR", "UTA", "WAS",
          }

          def download(url, headers=None):
              print(f"Downloading: {url}")
              request_headers = {
                  "User-Agent": "Mozilla/5.0 GitHub-Actions-NBA-App/1.0",
                  "Accept": "*/*",
                  "Cache-Control": "no-cache",
              }
              if headers:
                  request_headers.update(headers)

              request = urllib.request.Request(url, headers=request_headers)
              last_error = None

              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          status = getattr(response, "status", 200)
                          if status != 200:
                              raise RuntimeError(f"Unexpected HTTP status: {status}")
                          raw = response.read()
                          if not raw:
                              raise RuntimeError("Downloaded content is empty")
                          return raw.decode("utf-8-sig", errors="replace")
                  except Exception as error:
                      last_error = error
                      print(f"Attempt {attempt} failed: {error}")
                      if attempt < 3:
                          time.sleep(attempt * 5)

              raise RuntimeError(f"Could not download {url}: {last_error}")

          def clean_value(value):
              if value is None:
                  return None
              value = str(value).strip()
              if not value:
                  return None
              try:
                  if "." in value:
                      return float(value)
                  return int(value)
              except ValueError:
                  return value

          def clean_rows(rows):
              return [
                  {key: clean_value(value) for key, value in row.items()}
                  for row in rows
              ]

          def normalize_conference(value):
              value = str(value or "").strip().lower()
              if value in {"eastern", "east", "e"}:
                  return "East"
              if value in {"western", "west", "w"}:
                  return "West"
              raise RuntimeError(f"Unknown conference returned by API Ninjas: {value}")

          def as_float(value, default=None):
              if value is None or value == "":
                  return default
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return default

          def as_int(value, default=None):
              if value is None or value == "":
                  return default
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return default

          def parse_standings(payload):
              if not isinstance(payload, list):
                  raise RuntimeError(
                      f"API Ninjas returned {type(payload).__name__}, expected list"
                  )

              rows = []
              seen = set()

              for item in payload:
                  team_data = item.get("team") or {}
                  team_code = str(team_data.get("abbreviation") or "").upper().strip()
                  team_name = str(team_data.get("name") or "").strip()

                  if team_code not in EXPECTED_TEAM_CODES:
                      raise RuntimeError(
                          f"Unexpected NBA team from API Ninjas: {team_code} / {team_name}"
                      )
                  if team_code in seen:
                      raise RuntimeError(f"Duplicate team returned by API Ninjas: {team_code}")
                  seen.add(team_code)

                  conference = normalize_conference(item.get("conference"))
                  conference_position = as_int(item.get("conference_rank"))
                  wins = as_int(item.get("wins"), 0)
                  losses = as_int(item.get("losses"), 0)
                  games = as_int(item.get("games_played"), wins + losses)
                  win_pct = as_float(item.get("win_pct"))
                  games_back = as_float(item.get("games_behind"))
                  points_for = as_float(item.get("points_for"))
                  points_against = as_float(item.get("points_against"))

                  if conference_position is None:
                      raise RuntimeError(f"Missing conference_rank for {team_code}")
                  if games != wins + losses:
                      raise RuntimeError(
                          f"Invalid record for {team_code}: games={games}, W={wins}, L={losses}"
                      )
                  if win_pct is None:
                      win_pct = wins / games if games else 0

                  points_pg = (
                      round(points_for / games, 1)
                      if points_for is not None and games
                      else None
                  )
                  opponent_points_pg = (
                      round(points_against / games, 1)
                      if points_against is not None and games
                      else None
                  )

                  rows.append({
                      "season": SEASON,
                      "team": team_code,
                      "team_name": team_name,
                      "conference": conference,
                      "conference_position": conference_position,
                      "wins": wins,
                      "losses": losses,
                      "win_pct": round(float(win_pct), 4),
                      "games": games,
                      "games_back": games_back,
                      "points_pg": points_pg,
                      "opponent_points_pg": opponent_points_pg,
                  })

              missing = sorted(EXPECTED_TEAM_CODES - seen)
              unexpected = sorted(seen - EXPECTED_TEAM_CODES)
              if len(rows) != 30 or missing or unexpected:
                  raise RuntimeError(
                      f"Expected 30 NBA teams, got {len(rows)}. "
                      f"Missing: {missing}. Unexpected: {unexpected}"
                  )

              east = sorted(
                  [row for row in rows if row["conference"] == "East"],
                  key=lambda row: row["conference_position"],
              )
              west = sorted(
                  [row for row in rows if row["conference"] == "West"],
                  key=lambda row: row["conference_position"],
              )

              if len(east) != 15 or len(west) != 15:
                  raise RuntimeError(
                      f"Expected 15 teams per conference. East={len(east)}, West={len(west)}"
                  )

              expected_positions = list(range(1, 16))
              east_positions = [row["conference_position"] for row in east]
              west_positions = [row["conference_position"] for row in west]

              if east_positions != expected_positions:
                  raise RuntimeError(f"Invalid East conference ranks: {east_positions}")
              if west_positions != expected_positions:
                  raise RuntimeError(f"Invalid West conference ranks: {west_positions}")

              return east + west

          def parse_players_csv(csv_text):
              if not csv_text.strip():
                  raise RuntimeError("Player CSV is empty")

              raw_rows = list(csv.DictReader(io.StringIO(csv_text)))
              if not raw_rows:
                  raise RuntimeError("Player CSV does not contain rows")

              player_rows = clean_rows(raw_rows)
              if len(player_rows) < 300:
                  raise RuntimeError(f"Too few player statistics: {len(player_rows)}")

              player_rows.sort(
                  key=lambda row: (
                      -float(row.get("points_pg") or 0),
                      -float(row.get("rebounds_pg") or 0),
                      -float(row.get("assists_pg") or 0),
                      str(row.get("player_name") or ""),
                  )
              )
              return player_rows

          print("Downloading NBA standings from API Ninjas...")
          standings_json = download(
              STANDINGS_URL,
              headers={
                  "X-Api-Key": API_KEY,
                  "Accept": "application/json",
              },
          )

          try:
              standings_payload = json.loads(standings_json)
          except json.JSONDecodeError as error:
              raise RuntimeError("API Ninjas returned invalid JSON") from error

          standings_rows = parse_standings(standings_payload)

          print("Downloading NBA player statistics from BoxScore Lab...")
          players_csv = download(PLAYERS_URL)
          player_rows = parse_players_csv(players_csv)

          updated_at = datetime.now(timezone.utc).isoformat()

          standings_output = {
              "season": SEASON,
              "updatedAt": updated_at,
              "source": "API Ninjas",
              "results": len(standings_rows),
              "response": standings_rows,
          }

          players_output = {
              "season": SEASON,
              "updatedAt": updated_at,
              "source": "BoxScore Lab",
              "license": "CC BY 4.0",
              "results": len(player_rows),
              "response": player_rows,
          }

          with STANDINGS_FILE.open("w", encoding="utf-8") as file:
              json.dump(standings_output, file, ensure_ascii=False, indent=2)
              file.write("\n")

          with PLAYERS_FILE.open("w", encoding="utf-8") as file:
              json.dump(players_output, file, ensure_ascii=False, indent=2)
              file.write("\n")

          print("Season data generated successfully")
          print("Standings source: API Ninjas")
          print("Standings teams:", len(standings_rows))
          print("Season players:", len(player_rows))
          PYTHON

      - name: Verify generated files
        run: |
          python -m json.tool public/data/standings.json > /dev/null
          python -m json.tool public/data/season-player-stats.json > /dev/null

          python <<'PYTHON'
          import json
          from pathlib import Path

          standings_path = Path("public/data/standings.json")
          players_path = Path("public/data/season-player-stats.json")

          with standings_path.open(encoding="utf-8") as file:
              standings_data = json.load(file)
          with players_path.open(encoding="utf-8") as file:
              players_data = json.load(file)

          teams = standings_data.get("response", [])
          players = players_data.get("response", [])
          east = [team for team in teams if team.get("conference") == "East"]
          west = [team for team in teams if team.get("conference") == "West"]

          if standings_data.get("source") != "API Ninjas":
              raise RuntimeError(f"Unexpected standings source: {standings_data.get('source')}")
          if standings_data.get("season") != "2026-27":
              raise RuntimeError(f"Unexpected season: {standings_data.get('season')}")
          if len(teams) != 30 or standings_data.get("results") != 30:
              raise RuntimeError(f"Expected 30 teams, got {len(teams)}")
          if len(east) != 15 or len(west) != 15:
              raise RuntimeError(f"Invalid conference sizes: East={len(east)}, West={len(west)}")

          codes = [team.get("team") for team in teams]
          if len(set(codes)) != 30:
              raise RuntimeError("Duplicate team codes found")

          expected_positions = list(range(1, 16))
          if [int(t["conference_position"]) for t in east] != expected_positions:
              raise RuntimeError("East conference_rank sequence is invalid")
          if [int(t["conference_position"]) for t in west] != expected_positions:
              raise RuntimeError("West conference_rank sequence is invalid")

          for team in teams:
              if int(team["games"]) != int(team["wins"]) + int(team["losses"]):
                  raise RuntimeError(f"Invalid games total for {team['team']}")
              if not 0 <= float(team["win_pct"]) <= 1:
                  raise RuntimeError(f"Invalid win_pct for {team['team']}")

          if len(players) < 300:
              raise RuntimeError(f"Expected at least 300 players, got {len(players)}")
          if players_data.get("results") != len(players):
              raise RuntimeError("Player result count mismatch")

          print("Standings validation passed")
          print("East leader:", east[0]["team"], east[0]["wins"], "-", east[0]["losses"])
          print("West leader:", west[0]["team"], west[0]["wins"], "-", west[0]["losses"])
          print("West top 5:", " > ".join(team["team"] for team in west[:5]))
          print("Player records:", len(players))
          PYTHON

      - name: Show data summary
        run: |
          python <<'PYTHON'
          import json

          with open("public/data/standings.json", encoding="utf-8") as file:
              standings = json.load(file)
          with open("public/data/season-player-stats.json", encoding="utf-8") as file:
              players = json.load(file)

          rows = standings.get("response", [])
          east = [team for team in rows if team.get("conference") == "East"]
          west = [team for team in rows if team.get("conference") == "West"]

          print("Standings source:", standings.get("source"))
          print("Standings updated:", standings.get("updatedAt"))
          print("Standings teams:", standings.get("results"))
          print("Season players:", players.get("results"))

          print("\nEastern Conference:")
          for team in east:
              print(
                  str(team["conference_position"]).rjust(2),
                  team["team"],
                  f"{team['wins']}-{team['losses']}",
                  team["win_pct"],
                  "GB:", team.get("games_back"),
              )

          print("\nWestern Conference:")
          for team in west:
              print(
                  str(team["conference_position"]).rjust(2),
                  team["team"],
                  f"{team['wins']}-{team['losses']}",
                  team["win_pct"],
                  "GB:", team.get("games_back"),
              )

          print("\nTop 5 scorers:")
          for player in players.get("response", [])[:5]:
              print(player.get("player_name"), "-", player.get("points_pg"), "PPG")
          PYTHON

      - name: Commit updated season data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/standings.json
          git add public/data/season-player-stats.json

          if git diff --cached --quiet; then
            echo "No season data changes"
            exit 0
          fi

          git commit -m "Update NBA season standings and player stats"

          echo "Synchronizing with latest main..."
          git pull --rebase origin main

          echo "Pushing season data..."
          git push origin main
