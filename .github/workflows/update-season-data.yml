name: Update NBA season data

on:
  schedule:
    - cron: "35 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nba-season-data
  cancel-in-progress: false

jobs:
  update-season-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create data folder
        run: mkdir -p public/data

      - name: Download and convert season data
        run: |
          python <<'PYTHON'
          import csv
          import io
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          SEASON = "2026-27"

          STANDINGS_URL = (
              "https://boxscorelab.com/downloads/"
              f"{SEASON}-team-standings.csv"
          )

          PLAYERS_URL = (
              "https://boxscorelab.com/downloads/"
              f"{SEASON}-player-season-totals.csv"
          )

          OUTPUT_DIRECTORY = Path("public/data")

          STANDINGS_FILE = (
              OUTPUT_DIRECTORY / "standings.json"
          )

          PLAYERS_FILE = (
              OUTPUT_DIRECTORY / "season-player-stats.json"
          )

          OUTPUT_DIRECTORY.mkdir(
              parents=True,
              exist_ok=True,
          )

          def download_csv(url):
              print(f"Downloading: {url}")

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(compatible; NBAStatsApp/1.0)"
                      )
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60,
              ) as response:
                  text = response.read().decode(
                      "utf-8-sig"
                  )

              rows = list(
                  csv.DictReader(
                      io.StringIO(text)
                  )
              )

              print(
                  f"Downloaded {len(rows)} rows"
              )

              return rows

          def clean_value(value):
              if value is None:
                  return None

              value = value.strip()

              if value == "":
                  return None

              try:
                  if "." in value:
                      return float(value)

                  return int(value)

              except ValueError:
                  return value

          def clean_rows(rows):
              cleaned = []

              for row in rows:
                  cleaned_row = {}

                  for key, value in row.items():
                      cleaned_row[key] = clean_value(
                          value
                      )

                  cleaned.append(
                      cleaned_row
                  )

              return cleaned

          standings_rows = clean_rows(
              download_csv(
                  STANDINGS_URL
              )
          )

          player_rows = clean_rows(
              download_csv(
                  PLAYERS_URL
              )
          )

          if len(standings_rows) != 30:
              raise RuntimeError(
                  "Expected 30 NBA teams in standings, "
                  f"received {len(standings_rows)}"
              )

          if len(player_rows) == 0:
              raise RuntimeError(
                  "No player season statistics received"
              )

          standings_rows.sort(
              key=lambda row: (
                  -float(
                      row.get("win_pct")
                      or 0
                  ),
                  -int(
                      row.get("wins")
                      or 0
                  ),
                  int(
                      row.get("losses")
                      or 0
                  ),
                  str(
                      row.get("team")
                      or ""
                  ),
              )
          )

          player_rows.sort(
              key=lambda row: (
                  -float(
                      row.get("points_pg")
                      or 0
                  ),
                  -float(
                      row.get("rebounds_pg")
                      or 0
                  ),
                  -float(
                      row.get("assists_pg")
                      or 0
                  ),
                  str(
                      row.get("player_name")
                      or ""
                  ),
              )
          )

          updated_at = datetime.now(
              timezone.utc
          ).isoformat()

          standings_output = {
              "season": SEASON,
              "updatedAt": updated_at,
              "source": "BoxScore Lab",
              "license": "CC BY 4.0",
              "results": len(
                  standings_rows
              ),
              "response": standings_rows,
          }

          players_output = {
              "season": SEASON,
              "updatedAt": updated_at,
              "source": "BoxScore Lab",
              "license": "CC BY 4.0",
              "results": len(
                  player_rows
              ),
              "response": player_rows,
          }

          with STANDINGS_FILE.open(
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  standings_output,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          with PLAYERS_FILE.open(
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  players_output,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          print("")
          print("Season data generated successfully")
          print(
              f"Standings: {len(standings_rows)} teams"
          )
          print(
              f"Players: {len(player_rows)} players"
          )
          print(
              f"Updated at: {updated_at}"
          )
          PYTHON

      - name: Verify generated files
        run: |
          python -m json.tool public/data/standings.json > /dev/null
          python -m json.tool public/data/season-player-stats.json > /dev/null

          echo "JSON files are valid"

          echo ""
          echo "Standings:"
          ls -lh public/data/standings.json

          echo ""
          echo "Season player statistics:"
          ls -lh public/data/season-player-stats.json

      - name: Show data summary
        run: |
          python <<'PYTHON'
          import json

          with open(
              "public/data/standings.json",
              encoding="utf-8",
          ) as file:
              standings = json.load(file)

          with open(
              "public/data/season-player-stats.json",
              encoding="utf-8",
          ) as file:
              players = json.load(file)

          print(
              "Standings teams:",
              standings.get("results")
          )

          print(
              "Season players:",
              players.get("results")
          )

          print("")
          print("Top 5 scorers:")

          for player in players.get(
              "response",
              []
          )[:5]:
              print(
                  player.get("player_name"),
                  "-",
                  player.get("points_pg"),
                  "PPG"
              )
          PYTHON

      - name: Commit updated season data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/standings.json
          git add public/data/season-player-stats.json

          if git diff --cached --quiet; then
            echo "No season data changes"
          else
            git commit -m "Update NBA season standings and player stats"
            git push
          fi
